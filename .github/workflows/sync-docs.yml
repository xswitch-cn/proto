name: Sync docs to xctrl repo

on:
  push:
    branches:
      - main
    paths:
      - 'docs/xctrl.md'
      - 'docs/xctrl.html'
  workflow_dispatch:

jobs:
  sync-docs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure SSH for target repository
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.XCTRL_SYNC_SSH_KEY }}

      - name: Clone target repository
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          git clone git@github.com:xswitch-cn/xctrl.git /tmp/xctrl-repo

      - name: Copy docs files
        run: |
          mkdir -p /tmp/xctrl-repo/docs
          cp docs/xctrl.md /tmp/xctrl-repo/docs/xctrl.md
          cp docs/xctrl.html /tmp/xctrl-repo/docs/xctrl.html

      - name: Commit and push changes
        working-directory: /tmp/xctrl-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/xctrl.md docs/xctrl.html

          if git diff --cached --quiet; then
            echo "No changes to sync."
            exit 0
          fi

          git commit -m "Sync docs from proto repo"
          target_branch=$(git symbolic-ref --short refs/remotes/origin/HEAD | sed 's#^origin/##')
          git push origin HEAD:"${target_branch}"
